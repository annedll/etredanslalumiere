<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Être dans la lumière · Hors connexion</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #ffffff; color: #171717; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font-size: 16px; }
      @media (prefers-color-scheme: dark) { body { background: #100f1c; color: #f5f5f5; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Vous êtes hors connexion</h1>
      <p>Être dans la lumière reviendra dès que le réseau sera de retour.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
