    <script>window.__USIN_SETTINGS__ = {"biz.name":"Être dans la Lumière","biz.practitioner":"Anne Kételair","biz.titles":"Thérapeute énergéticienne, Coach bien-être & Enseignante","biz.slogan":"Ouvrir une porte vers la libération","biz.address":"Place Abbé César Renard, 31","biz.postal":"7730","biz.city":"Bailleul (Estaimpuis)","biz.country":"Belgique","health.warning":"Les soins énergétiques sont complémentaires et ne remplacent pas un avis, un diagnostic ou un traitement médical.","cancel.policy":"Merci de prévenir au moins 48 heures à l'avance en cas d'empêchement. Pour les formations, une date de report vous est proposée en priorité.","booking.mode":"slots","deposit.enabled":"false","deposit.amount":"50","meditation.card_price":"110","beta_mode":"false","biz.domains":"Méditation et chants sacrés, développement personnel, spiritualité, thérapies et soins énergétiques","home.announce.enabled":"true","demo_seeded":"true","biz.city.en":"Bailleul (Estaimpuis)","biz.city.nl":"Bailleul (Estaimpuis)","biz.name.en":"Être dans la Lumière","biz.name.nl":"Être dans la Lumière","home.announce.text":"Méditation guidée chaque mois : découvrez les prochaines dates dans l'agenda.","home.hero.title.nl":"Energetische behandelingen, opleidingen en meditatie","home.hero.subtitle":"Anne Kételair vous accompagne au cabinet, à distance ou en visio pour vous ressourcer, apaiser le stress et retrouver de la clarté.","home.benefits.title":"Ce que les soins peuvent vous apporter","home.benefits":["Se ressourcer","Sérénité","Gérer son stress","Se recentrer","Vie relationnelle","Clarté d'esprit","Apaisement et détente","Soulager ses douleurs","Développement personnel","Cheminer dans sa spiritualité"],"home.distance":"Soins possibles à distance et en visio, pour les humains, les animaux, les plantes, les maisons et les situations.","home.hero.title":"Soins énergétiques , Formations et méditation","home.zone.en":"The practice is located at Place Abbé César Renard, 31 in 7730 Bailleul (Estaimpuis), very close to the French border. It welcomes people from Hainaut (Estaimpuis, Mouscron, Tournai) and northern France (Roubaix, Tourcoing, Lille). Healing sessions and numerology are also available remotely.","home.zone.nl":"De praktijk bevindt zich op Place Abbé César Renard, 31 in 7730 Bailleul (Estaimpuis), vlak bij de Franse grens. Ze verwelkomt mensen uit Henegouwen (Estaimpuis, Moeskroen, Doornik) en uit het noorden van Frankrijk (Roubaix, Tourcoing, Rijsel). De behandelingen en de numerologie gebeuren ook op afstand.","home.cta.body.en":"Book a slot online, request a call back or call Anne directly. Payment for sessions is made on site or by bank transfer.","home.cta.body.nl":"Reserveer online een tijdslot, vraag om teruggebeld te worden of bel Anne rechtstreeks. De betaling van de behandelingen gebeurt ter plaatse of per overschrijving.","home.cta.title.en":"Ready to give yourself some time?","home.cta.title.nl":"Klaar om uzelf een moment voor uzelf te gunnen?","home.intro.body.en":"A consultation always begins with time to listen, with kindness and empathy. Together, we put words to what hurts through biological decoding, and then the energy healing helps you release tension and find your balance again.\n\nDepending on your needs, the session may include mantras, essential oils or the drawing of an oracle card. Each session is personalized and respects your own pace.\n\nAnne also shares what she practices: Reiki Usui initiations in 4 degrees, Lahochi / 13th Octave, the Golden Triangle of Isis and Language of Light, dowsing workshops on 3 levels, numerology and guided meditations every month.","home.intro.body.nl":"Een consultatie begint altijd met een moment van luisteren, vol goedheid en empathie. Samen zetten we woorden op de kwalen dankzij biologische decodering, waarna de energetische behandeling u helpt om spanningen los te laten en uw evenwicht terug te vinden.\n\nAfhankelijk van uw behoeften kan de sessie mantra's, etherische oliën of het trekken van een orakelkaart omvatten. Elke begeleiding is persoonlijk en respecteert uw eigen tempo.\n\nAnne geeft ook door wat ze zelf beoefent: inwijdingen in Reiki Usui in 4 graden, in Lahochi / 13e Octaaf, in de Gouden Driehoek van Isis en Lichttaal, workshops radiesthesie in 3 niveaus, numerologie en begeleide meditaties elke maand.","home.intro.title.en":"Energy healing, listening to the body and the soul","home.intro.title.nl":"Energetische behandelingen, luisteren naar lichaam en ziel","home.announce.text.en":"Guided meditation every month: discover the upcoming dates in the calendar.","home.announce.text.nl":"Begeleide meditatie elke maand: ontdek de volgende data in de agenda.","faq.1.q":"Comment se déroule une consultation avec soin énergétique ?","faq.1.a":"La consultation dure 1h30 et coûte 80 €. Elle commence par un temps d'écoute, puis vient le soin énergétique. La séance peut être complétée par le décodage biologique, des mantras, des huiles essentielles ou le tirage d'une carte.","faq.2.a":"Oui. Les soins peuvent se faire à distance ou en visio, pour vous-même mais aussi pour un animal, une plante, une maison ou une situation. Le rendez-vous se fixe comme une séance au cabinet.","faq.3.q":"Combien coûte un soin énergétique ?","faq.5.q":"Les soins énergétiques remplacent-ils un traitement médical ?","training.certificate":"Un syllabus et un certificat sont remis à chaque initiation, formation ou atelier radiesthésie","biz.slogan.en":"Opening a door to liberation","biz.slogan.nl":"Een deur openen naar bevrijding","biz.titles.en":"Energy Therapist, Wellness Coach & Teacher","biz.titles.nl":"Energetisch therapeute, welzijnscoach & lerares","biz.address.en":"Place Abbé César Renard, 31","biz.address.nl":"Place Abbé César Renard, 31","biz.country.en":"Belgium","biz.country.nl":"België","biz.domains.en":"Meditation and sacred chants, personal development, spirituality, energy therapies and treatments","biz.domains.nl":"Meditatie en heilige gezangen, persoonlijke ontwikkeling, spiritualiteit, therapieën en energetische behandelingen","booking.mode.en":"slots","booking.mode.nl":"slots","cancel.policy.en":"Please give at least 48 hours' notice if you are unable to attend. For training courses, a new date will be offered to you as a priority.","cancel.policy.nl":"Gelieve minstens 48 uur van tevoren te verwittigen als je verhinderd bent. Bij opleidingen wordt er bij voorrang een nieuwe datum voorgesteld.","home.benefits.en":["Recharge your energy","Serenity","Manage your stress","Re-centre yourself","Relationships","Mental clarity","Soothing relaxation","Relieve your pain","Personal development","Walk your spiritual path"],"home.benefits.nl":["Nieuwe energie opdoen","Innerlijke rust","Omgaan met stress","Weer bij jezelf komen","Relaties","Een heldere geest","Ontspanning en verzachting","Pijn verlichten","Persoonlijke ontwikkeling","Je weg gaan in je spiritualiteit"],"home.distance.en":"Treatments are also available remotely and by video call, for people, animals, plants, homes and situations.","home.distance.nl":"Behandelingen zijn ook mogelijk op afstand en via videobellen, voor mensen, dieren, planten, huizen en situaties.","health.warning.en":"Energy treatments are complementary and do not replace medical advice, diagnosis or treatment.","health.warning.nl":"Energetische behandelingen zijn aanvullend en vervangen geen medisch advies, geen diagnose en geen medische behandeling.","biz.practitioner.en":"Anne Kételair","biz.practitioner.nl":"Anne Kételair","home.hero.subtitle.en":"Anne Kételair supports you at her practice, remotely or by video call to help you recharge, ease stress and regain clarity.","home.hero.subtitle.nl":"Anne Kételair begeleidt je in de praktijk, op afstand of via videobellen om op te laden, stress te verzachten en weer helderheid te vinden.","home.benefits.title.en":"What the treatments can bring you","home.benefits.title.nl":"Wat de behandelingen je kunnen brengen","faq.2.q":"Un soin à distance est-il possible ?","formations.title":"Formations & initiations","formations.intro":"Formation Thérapeute Energéticien(ne) - Initiations au Reiki Usui (4 degrés), au Lahochi / 13e Octave, au Triangle Doré d'Isis, au Langage de lumière et Shamballa, en petit groupe à Bailleul (Estaimpuis).","ateliers.title":"Ateliers & méditations","ateliers.intro":"Pendule et radiesthésie, sur 3 niveaux, numérologie de la Métamorphose, et séances de méditations guidées chaque mois.","agenda.title":"Agenda","agenda.intro":"Toutes les prochaines dates des formations, ateliers et méditations. Inscrivez-vous en ligne : les places sont limitées.","blog.title":"Blog","blog.intro":"Des articles sur les soins énergétiques, le langage de lumière, la numérologie, le Reiki et la méditation.","testimonials.title":"Témoignages","testimonials.intro":"Les retours des personnes accompagnées par Anne, publiés avec leur accord.","ebooks.title":"E-books","ebooks.intro":"Des guides à lire chez soi, disponibles immédiatement après l'achat.","contact.title":"Contact","contact.intro":"Pour une question ou un rendez-vous, appelez Anne, écrivez-lui ou utilisez le formulaire ci-dessous.","book.title":"Prendre rendez-vous","usin_tr_src":{"faq.1.a":"La consultation dure 1h30 et coûte 80 €. Elle commence par un temps d'écoute, puis vient le soin énergétique. La séance peut être complétée par le décodage biologique, des mantras, des huiles essentielles ou le tirage d'une carte.","faq.1.q":"Comment se déroule une consultation avec soin énergétique ?","faq.2.a":"Oui. Les soins peuvent se faire à distance ou en visio, pour vous-même mais aussi pour un animal, une plante, une maison ou une situation. Le rendez-vous se fixe comme une séance au cabinet.","faq.2.q":"Un soin à distance est-il possible ?","faq.3.a":"Un soin seul d'une heure coûte 70 € (250 € les 4 séances). La consultation avec soin de 1h30 coûte 80 €, puis 70 € par heure suivante. L'accompagnement est proposé en 4 séances (300 €) ou 7 séances (490 €).","faq.3.q":"Combien coûte un soin énergétique ?","faq.4.a":"Chaque initiation donne lieu à la remise d'un syllabus et d'un certificat. Le Reiki Usui se transmet en 4 degrés : le 1er degré se déroule sur 2 journées (195 €), les 2e, 3e et 4e degrés sur une journée.","faq.4.q":"Que reçoit-on lors d'une initiation au Reiki ?","faq.5.a":"Non. Les soins énergétiques sont complémentaires et ne remplacent pas un avis, un diagnostic ou un traitement médical. Continuez à suivre les conseils de votre médecin.","faq.5.q":"Les soins énergétiques remplacent-ils un traitement médical ?","faq.6.a":"Chaque mois, une méditation guidée angélique à thème d'une heure quart (21 €), avec olfactif et oracle. La méditation se déroule dans le dôme au centre \"Ô coeur du Phoenix\" à Ramegnies-Chin. Un thème différent chaque mois en symbiose avec les énergies du moment. La séance est clôturée par un soin vibratoire au Langage de lumière qui vient travailler plus profondément vos intentions du jour. Chaque séance vous permet d'avancer sur votre chemin d'évolution spirituelle ou de guérison, vers plus de paix, de sérenité.","faq.6.q":"Comment fonctionnent les méditations & soins vibratoires  mensuelles ?","biz.city":"Bailleul (Estaimpuis)","biz.name":"Être dans la Lumière","home.zone":"Le cabinet se trouve Place Abbé César Renard, 31 à 7730 Bailleul (Estaimpuis), tout près de la frontière française. Il accueille les personnes du Hainaut (Estaimpuis, Mouscron, Tournai) et du nord de la France (Roubaix, Tourcoing, Lille). Les soins et la numérologie se font aussi à distance.","about.body":"Je m'appelle Anne Kételair. Thérapeute énergéticienne, coach bien-être et enseignante, je reçois à Bailleul (Estaimpuis) les personnes qui souhaitent se ressourcer, apaiser leur stress ou avancer sur leur chemin de développement personnel et spirituel.\n\nMon accompagnement repose sur l'écoute, la bienveillance et l'empathie. J'utilise le soin énergétique, le décodage biologique, le coaching, la numérologie de la Métamorphose, les mantras, les huiles essentielles et l'oracle.\n\nJ'enseigne le Reiki Usui jusqu'au degré de Maître-enseignant, le Lahochi / 13e Octave, le Triangle Doré d'Isis, Langage de lumière, la radiesthésie et le Shamballa, et j'anime des méditations guidées et des chants sacrés.","biz.slogan":"Ouvrir une porte vers la libération","biz.titles":"Thérapeute énergéticienne, Coach bien-être & Enseignante","blog.intro":"Des articles sur les soins énergétiques, le langage de lumière, la numérologie, le Reiki et la méditation.","blog.title":"Blog","book.intro":"Choisissez votre soin, puis réservez un créneau libre ou demandez à être rappelée. Le paiement se fait sur place ou par virement.","book.title":"Prendre rendez-vous","about.title":"Qui suis-je ?","biz.address":"Place Abbé César Renard, 31","biz.country":"Belgique","biz.domains":"Méditation et chants sacrés, développement personnel, spiritualité, thérapies et soins énergétiques","soins.intro":"Consultations avec soin énergétique, accompagnement sur plusieurs séances, coaching et numérologie de la Métamorphose, au cabinet de Bailleul, à distance ou en visio.","soins.title":"Soins & accompagnement","agenda.intro":"Toutes les prochaines dates des formations, ateliers et méditations. Inscrivez-vous en ligne : les places sont limitées.","agenda.title":"Agenda","booking.mode":"slots","ebooks.intro":"Des guides à lire chez soi, disponibles immédiatement après l'achat.","ebooks.title":"E-books","cancel.policy":"Merci de prévenir au moins 48 heures à l'avance en cas d'empêchement. Pour les formations, une date de report vous est proposée en priorité.","contact.intro":"Pour une question ou un rendez-vous, appelez Anne, écrivez-lui ou utilisez le formulaire ci-dessous.","contact.title":"Contact","home.benefits":["Se ressourcer","Sérénité","Gérer son stress","Se recentrer","Vie relationnelle","Clarté d'esprit","Apaisement et détente","Soulager ses douleurs","Développement personnel","Cheminer dans sa spiritualité"],"home.cta.body":"Réservez un créneau en ligne, demandez à être rappelée ou appelez directement Anne. Le paiement des soins se fait sur place ou par virement.","home.distance":"Soins possibles à distance et en visio, pour les humains, les animaux, les plantes, les maisons et les situations.","ateliers.intro":"Pendule et radiesthésie, sur 3 niveaux, numérologie de la Métamorphose, et séances de méditations guidées chaque mois.","ateliers.title":"Ateliers & méditations","health.warning":"Les soins énergétiques sont complémentaires et ne remplacent pas un avis, un diagnostic ou un traitement médical.","home.cta.title":"Prête à vous offrir un temps pour vous ?","home.hero.title":"Soins énergétiques , Formations et méditation","home.intro.body":"Une consultation commence toujours par un temps d'écoute, avec bienveillance et empathie. Ensemble, nous mettons des mots sur les maux grâce au décodage biologique, puis le soin énergétique vous aide à relâcher les tensions et à retrouver votre équilibre.\n\nSelon vos besoins, la séance peut intégrer des mantras, des huiles essentielles ou le tirage d'une carte d'oracle. Chaque accompagnement est personnalisé et respecte votre rythme.\n\nAnne transmet aussi ce qu'elle pratique : initiations au Reiki Usui en 4 degrés, au Lahochi / 13e Octave, au Triangle Doré d'Isis et Langage de lumière, ateliers de radiesthésie sur 3 niveaux , nulmérologie et méditations guidées chaque mois.","biz.practitioner":"Anne Kételair","formations.intro":"Formation Thérapeute Energéticien(ne) - Initiations au Reiki Usui (4 degrés), au Lahochi / 13e Octave, au Triangle Doré d'Isis, au Langage de lumière et Shamballa, en petit groupe à Bailleul (Estaimpuis).","formations.title":"Formations & initiations","home.intro.title":"Les soins énergétiques, une écoute du corps et de l'âme","home.announce.text":"Méditation guidée chaque mois : découvrez les prochaines dates dans l'agenda.","home.hero.subtitle":"Anne Kételair vous accompagne au cabinet, à distance ou en visio pour vous ressourcer, apaiser le stress et retrouver de la clarté.","testimonials.intro":"Les retours des personnes accompagnées par Anne, publiés avec leur accord.","testimonials.title":"Témoignages","home.benefits.title":"Ce que les soins peuvent vous apporter","training.certificate":"Un syllabus et un certificat sont remis à chaque initiation, formation ou atelier radiesthésie"},"home.intro.title":"Les soins énergétiques, une écoute du corps et de l'âme","home.zone":"Le cabinet se trouve Place Abbé César Renard, 31 à 7730 Bailleul (Estaimpuis), tout près de la frontière française. Il accueille les personnes du Hainaut (Estaimpuis, Mouscron, Tournai) et du nord de la France (Roubaix, Tourcoing, Lille). Les soins et la numérologie se font aussi à distance.","home.cta.title":"Prête à vous offrir un temps pour vous ?","home.cta.body":"Réservez un créneau en ligne, demandez à être rappelée ou appelez directement Anne. Le paiement des soins se fait sur place ou par virement.","home.hero.image":"https://zigsggfhmafapjvjxlpt.supabase.co/storage/v1/object/public/public-assets/images/1794486295309-03fs2u.webp","home.hero.title.en":"Energy healing, training and meditation","training.certificate.en":"A syllabus and a certificate are given with every initiation, training course or radiesthesia workshop","training.certificate.nl":"Bij elke initiatie, opleiding of workshop radiësthesie ontvangt u een syllabus en een certificaat","faq.3.a":"Un soin seul d'une heure coûte 70 € (250 € les 4 séances). La consultation avec soin de 1h30 coûte 80 €, puis 70 € par heure suivante. L'accompagnement est proposé en 4 séances (300 €) ou 7 séances (490 €).","faq.4.q":"Que reçoit-on lors d'une initiation au Reiki ?","faq.4.a":"Chaque initiation donne lieu à la remise d'un syllabus et d'un certificat. Le Reiki Usui se transmet en 4 degrés : le 1er degré se déroule sur 2 journées (195 €), les 2e, 3e et 4e degrés sur une journée.","faq.5.a":"Non. Les soins énergétiques sont complémentaires et ne remplacent pas un avis, un diagnostic ou un traitement médical. Continuez à suivre les conseils de votre médecin.","faq.6.q":"Comment fonctionnent les méditations & soins vibratoires  mensuelles ?","faq.6.a":"Chaque mois, une méditation guidée angélique à thème d'une heure quart (21 €), avec olfactif et oracle. La méditation se déroule dans le dôme au centre \"Ô coeur du Phoenix\" à Ramegnies-Chin. Un thème différent chaque mois en symbiose avec les énergies du moment. La séance est clôturée par un soin vibratoire au Langage de lumière qui vient travailler plus profondément vos intentions du jour. Chaque séance vous permet d'avancer sur votre chemin d'évolution spirituelle ou de guérison, vers plus de paix, de sérenité.","soins.title":"Soins & accompagnement","book.intro":"Choisissez votre soin, puis réservez un créneau libre ou demandez à être rappelée. Le paiement se fait sur place ou par virement.","about.title":"Qui suis-je ?","about.body":"Je m'appelle Anne Kételair. Thérapeute énergéticienne, coach bien-être et enseignante, je reçois à Bailleul (Estaimpuis) les personnes qui souhaitent se ressourcer, apaiser leur stress ou avancer sur leur chemin de développement personnel et spirituel.\n\nMon accompagnement repose sur l'écoute, la bienveillance et l'empathie. J'utilise le soin énergétique, le décodage biologique, le coaching, la numérologie de la Métamorphose, les mantras, les huiles essentielles et l'oracle.\n\nJ'enseigne le Reiki Usui jusqu'au degré de Maître-enseignant, le Lahochi / 13e Octave, le Triangle Doré d'Isis, Langage de lumière, la radiesthésie et le Shamballa, et j'anime des méditations guidées et des chants sacrés.","about.image":"https://zigsggfhmafapjvjxlpt.supabase.co/storage/v1/object/public/public-assets/images/1794485611865-zw4p1n.webp","home.intro.body":"Une consultation commence toujours par un temps d'écoute, avec bienveillance et empathie. Ensemble, nous mettons des mots sur les maux grâce au décodage biologique, puis le soin énergétique vous aide à relâcher les tensions et à retrouver votre équilibre.\n\nSelon vos besoins, la séance peut intégrer des mantras, des huiles essentielles ou le tirage d'une carte d'oracle. Chaque accompagnement est personnalisé et respecte votre rythme.\n\nAnne transmet aussi ce qu'elle pratique : initiations au Reiki Usui en 4 degrés, au Lahochi / 13e Octave, au Triangle Doré d'Isis et Langage de lumière, ateliers de radiesthésie sur 3 niveaux , nulmérologie et méditations guidées chaque mois.","home.hero.image.size":"full","soins.intro":"Consultations avec soin énergétique, accompagnement sur plusieurs séances, coaching et numérologie de la Métamorphose, au cabinet de Bailleul, à distance ou en visio.","faq.1.a.en":"The consultation lasts 1h30 and costs €80. It begins with a time of listening, followed by the energy healing session. The session can be complemented by biological decoding, mantras, essential oils or the drawing of a card.","faq.1.a.nl":"De consultatie duurt 1u30 en kost 80 €. Ze begint met een moment van luisteren, daarna volgt de energetische behandeling. De sessie kan aangevuld worden met biologische decodering, mantra's, etherische oliën of het trekken van een kaart.","faq.1.q.en":"What does an energy healing consultation involve?","faq.1.q.nl":"Hoe verloopt een consultatie met energetische behandeling?","faq.2.a.en":"Yes. Treatments can be done remotely or by video call, for yourself but also for an animal, a plant, a home or a situation. The appointment is scheduled just like a session at the practice.","faq.2.a.nl":"Ja. De behandelingen kunnen op afstand of via video plaatsvinden, voor uzelf maar ook voor een dier, een plant, een huis of een situatie. De afspraak wordt gemaakt zoals voor een sessie in de praktijk.","faq.2.q.en":"Is a remote healing session possible?","faq.2.q.nl":"Is een behandeling op afstand mogelijk?","faq.3.a.en":"A single one-hour session costs €70 (€250 for 4 sessions). The 1h30 consultation with a healing session costs €80, then €70 for each additional hour. Ongoing support is offered as 4 sessions (€300) or 7 sessions (€490).","faq.3.a.nl":"Een behandeling van een uur kost 70 € (250 € voor 4 sessies). De consultatie met behandeling van 1u30 kost 80 €, daarna 70 € per extra uur. De begeleiding wordt aangeboden in 4 sessies (300 €) of 7 sessies (490 €).","faq.3.q.en":"How much does an energy healing session cost?","faq.3.q.nl":"Hoeveel kost een energetische behandeling?","faq.4.a.en":"Every initiation comes with a syllabus and a certificate. Reiki Usui is taught in 4 degrees: the 1st degree takes place over 2 days (€195), and the 2nd, 3rd and 4th degrees over one day each.","faq.4.a.nl":"Bij elke initiatie ontvangt u een syllabus en een certificaat. Reiki Usui wordt doorgegeven in 4 graden: de 1e graad verloopt over 2 dagen (195 €), de 2e, 3e en 4e graad over één dag.","faq.4.q.en":"What do you receive during a Reiki initiation?","faq.4.q.nl":"Wat ontvangt u bij een Reiki-initiatie?","faq.5.a.en":"No. Energy healing is complementary and does not replace medical advice, a diagnosis or treatment. Please continue to follow your doctor's advice.","faq.5.a.nl":"Nee. Energetische behandelingen zijn een aanvulling en vervangen geen medisch advies, geen diagnose en geen medische behandeling. Blijf de raad van uw arts opvolgen.","faq.5.q.en":"Do energy healing sessions replace medical treatment?","faq.5.q.nl":"Vervangen energetische behandelingen een medische behandeling?","faq.6.a.en":"Each month, a themed guided angelic meditation lasting an hour and a quarter (€21), with scents and an oracle. The meditation takes place in the dome at the \"Ô coeur du Phoenix\" center in Ramegnies-Chin. The theme changes every month, in harmony with the energies of the moment. The session ends with a vibrational healing in the Language of Light, which works more deeply on your intentions for the day. Each session helps you move forward on your path of spiritual growth or healing, towards more peace and serenity.","faq.6.a.nl":"Elke maand is er een begeleide engelenmeditatie rond een thema van een uur en een kwartier (21 €), met geuren en orakel. De meditatie vindt plaats in de koepel in het centrum \"Ô coeur du Phoenix\" in Ramegnies-Chin. Elke maand een ander thema, in harmonie met de energieën van het moment. De sessie wordt afgesloten met een vibratiebehandeling met Lichttaal, die uw intenties van de dag nog dieper doorwerkt. Elke sessie helpt u vooruit op uw pad van spirituele groei of heling, naar meer vrede en sereniteit.","faq.6.q.en":"How do the monthly meditations & vibrational healing sessions work?","faq.6.q.nl":"Hoe werken de maandelijkse meditaties & vibratiebehandelingen?","about.body.en":"My name is Anne Kételair. As an energy therapist, wellness coach and teacher, I welcome people at my practice in Bailleul (Estaimpuis) who wish to recharge, ease their stress or move forward on their path of personal and spiritual development.\n\nMy approach is based on listening, kindness and empathy. I use energy healing, biological decoding, coaching, Metamorphosis numerology, mantras, essential oils and oracle cards.\n\nI teach Reiki Usui up to the Master-Teacher degree, Lahochi / 13th Octave, the Isis Golden Triangle, the Language of Light, radiesthesia and Shamballa, and I lead guided meditations and sacred chanting.","about.body.nl":"Ik heet Anne Kételair. Als energetisch therapeute, welzijnscoach en lerares ontvang ik in Bailleul (Estaimpuis) mensen die willen bijtanken, hun stress willen verlichten of vooruit willen gaan op hun pad van persoonlijke en spirituele ontwikkeling.\n\nMijn begeleiding berust op luisteren, welwillendheid en empathie. Ik werk met energetische behandeling, biologische decodering, coaching, numerologie van de Metamorfose, mantra's, etherische oliën en het orakel.\n\nIk geef les in Reiki Usui tot en met de graad van Meester-leraar, Lahochi / 13e Octaaf, de Gouden Driehoek van Isis, Lichttaal, radiësthesie en Shamballa, en ik begeleid meditaties en heilige gezangen.","blog.intro.en":"Articles about energy healing, the Language of Light, numerology, Reiki and meditation.","blog.intro.nl":"Artikelen over energetische behandelingen, lichttaal, numerologie, Reiki en meditatie.","blog.title.en":"Blog","blog.title.nl":"Blog","book.intro.en":"Choose your treatment, then book an available slot or ask to be called back. Payment is made on site or by bank transfer.","book.intro.nl":"Kies uw behandeling en reserveer vervolgens een vrij tijdslot of vraag om teruggebeld te worden. De betaling gebeurt ter plaatse of via overschrijving.","book.title.en":"Book an appointment","book.title.nl":"Een afspraak maken","about.title.en":"Who am I?","about.title.nl":"Wie ben ik?","soins.intro.en":"Consultations with energy healing, support over several sessions, coaching and Metamorphosis numerology, at the Bailleul practice, remotely or by video call.","soins.intro.nl":"Consultaties met energetische behandeling, begeleiding over meerdere sessies, coaching en numerologie van de Metamorfose, in de praktijk in Bailleul, op afstand of via video.","soins.title.en":"Healing & support","soins.title.nl":"Behandelingen & begeleiding","agenda.intro.en":"All upcoming dates for trainings, workshops and meditations. Sign up online: places are limited.","agenda.intro.nl":"Alle komende data van de opleidingen, workshops en meditaties. Schrijf u online in: het aantal plaatsen is beperkt.","agenda.title.en":"Calendar","agenda.title.nl":"Agenda","ebooks.intro.en":"Guides to read at home, available immediately after purchase.","ebooks.intro.nl":"Gidsen om thuis te lezen, direct beschikbaar na aankoop.","ebooks.title.en":"E-books","ebooks.title.nl":"E-books","contact.intro.en":"For a question or an appointment, call Anne, write to her or use the form below.","contact.intro.nl":"Voor een vraag of een afspraak kunt u Anne bellen, haar een bericht sturen of het onderstaande formulier gebruiken.","contact.title.en":"Contact","contact.title.nl":"Contact","ateliers.intro.en":"Pendulum and radiesthesia in 3 levels, Metamorphosis numerology, and guided meditation sessions every month.","ateliers.intro.nl":"Pendel en radiësthesie op 3 niveaus, numerologie van de Metamorfose, en elke maand begeleide meditaties.","ateliers.title.en":"Workshops & meditations","ateliers.title.nl":"Workshops & meditaties","formations.intro.en":"Energy Therapist Training - Initiations in Reiki Usui (4 degrees), Lahochi / 13th Octave, Isis Golden Triangle, Language of Light and Shamballa, in small groups in Bailleul (Estaimpuis).","formations.intro.nl":"Opleiding Energetisch therapeut - Initiaties in Reiki Usui (4 graden), Lahochi / 13e Octaaf, de Gouden Driehoek van Isis, Lichttaal en Shamballa, in kleine groep in Bailleul (Estaimpuis).","formations.title.en":"Training & initiations","formations.title.nl":"Opleidingen & initiaties","testimonials.intro.en":"Feedback from the people Anne has supported, published with their consent.","testimonials.intro.nl":"De ervaringen van de mensen die door Anne begeleid werden, gepubliceerd met hun toestemming.","testimonials.title.en":"Testimonials","testimonials.title.nl":"Getuigenissen"};</script>
