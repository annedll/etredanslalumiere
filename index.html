e, puis vient le soin énergétique. La séance peut être complétée par le décodage biologique, des mantras, des huiles essentielles ou le tirage d'une carte.","faq.2.a":"Oui. Les soins peuvent se faire à distance ou en visio, pour vous-même mais aussi pour un animal, une plante, une maison ou une situation. Le rendez-vous se fixe comme une séance au cabinet.","faq.3.q":"Combien coûte un soin énergétique ?","faq.5.q":"Les soins énergétiques remplacent-ils un traitement médical ?","biz.slogan.en":"Opening a door to liberation","biz.slogan.nl":"Een deur openen naar bevrijding","biz.titles.en":"Energy Therapist, Wellness Coach & Teacher","biz.titles.nl":"Energetisch therapeute, welzijnscoach & lerares","biz.address.en":"Place Abbé César Renard, 31","biz.address.nl":"Place Abbé César Renard, 31","biz.country.en":"Belgium","biz.country.nl":"België","booking.mode.en":"slots","booking.mode.nl":"slots","cancel.policy.en":"Please give at least 48 hours' notice if you are unable to attend. For training courses, a new date will be offered to you as a priority.","cancel.policy.nl":"Gelieve minstens 48 uur van tevoren te verwittigen als je verhinderd bent. Bij opleidingen wordt er bij voorrang een nieuwe datum voorgesteld.","home.benefits.en":["Recharge your energy","Serenity","Manage your stress","Re-centre yourself","Relationships","Mental clarity","Soothing relaxation","Relieve your pain","Personal development","Walk your spiritual path"],"home.benefits.nl":["Nieuwe energie opdoen","Innerlijke rust","Omgaan met stress","Weer bij jezelf komen","Relaties","Een heldere geest","Ontspanning en verzachting","Pijn verlichten","Persoonlijke ontwikkeling","Je weg gaan in je spiritualiteit"],"home.distance.en":"Treatments are also available remotely and by video call, for people, animals, plants, homes and situations.","home.distance.nl":"Behandelingen zijn ook mogelijk op afstand en via videobellen, voor mensen, dieren, planten, huizen en situaties.","health.warning.en":"Energy treatments are complementary and do not replace medical advice, diagnosis or treatment.","health.warning.nl":"Energetische behandelingen zijn aanvullend en vervangen geen medisch advies, geen diagnose en geen medische behandeling.","home.benefits.title.en":"What the treatments can bring you","home.benefits.title.nl":"Wat de behandelingen je kunnen brengen","home.intro.title":"Un temps pour vous déposer, aller à la rencontre de vous-même et pour accueillir les libérations","home.hero.title.en":"Energy Healing, Trainings & Meditations","formations.intro":"Formation Thérapeute Energéticien(ne) - Initiations au Reiki Usui (4 degrés), au Lahochi / 13e Octave, Triangle Doré d'Isis, Langage de lumière et Shamballa, en petit groupe à Bailleul (Estaimpuis).New","home.hero.image":"https://zigsggfhmafapjvjxlpt.supabase.co/storage/v1/object/public/public-assets/images/1794556508253-180k71.webp","home.hero.subtitle.en":"Anne Kételair welcomes you at her practice, remotely or by video, to reconnect with your inner light and find more peace and clarity of mind.","home.hero.subtitle.nl":"Anne Kételair begeleidt u in de praktijk, op afstand of via videogesprek, om opnieuw verbinding te maken met uw innerlijke licht en zo meer rust en helderheid van geest te vinden.","faq.2.q":"Un soin à distance est-il possible ?","formations.title":"Formations & initiations","ateliers.title":"Ateliers & méditations","ateliers.intro":"Pendule et radiesthésie, sur 3 niveaux, numérologie de la Métamorphose, et séances de méditations guidées chaque mois.","agenda.title":"Agenda","agenda.intro":"Toutes les prochaines dates des formations, ateliers et méditations. Inscrivez-vous en ligne : les places sont limitées.","blog.title":"Blog","blog.intro":"Des articles sur les soins énergétiques, le langage de lumière, la numérologie, le Reiki et la méditation.","testimonials.title":"Témoignages","testimonials.intro":"Les retours des personnes accompagnées par Anne, publiés avec leur accord.","ebooks.title":"E-books","ebooks.intro":"Des guides à lire chez soi, disponibles immédiatement après l'achat.","contact.title":"Contact","contact.intro":"Pour une question ou un rendez-vous, appelez Anne, écrivez-lui ou utilisez le formulaire ci-dessous.","book.title":"Prendre rendez-vous","usin_tr_src":{"biz.bce":"BE 712.839.3430","faq.1.a":"La consultation dure 1h30 et coûte 80 €. Elle commence par un temps d'écoute, puis vient le soin énergétique. La séance peut être complétée par le décodage biologique, des mantras, des huiles essentielles ou le tirage d'une carte.","faq.1.q":"Comment se déroule une consultation avec soin énergétique ?","faq.2.a":"Oui. Les soins peuvent se faire à distance ou en visio, pour vous-même mais aussi pour un animal, une plante, une maison ou une situation. Le rendez-vous se fixe comme une séance au cabinet.","faq.2.q":"Un soin à distance est-il possible ?","faq.3.a":"Un soin seul d'une heure coûte 70 € (250 € les 4 séances). La consultation avec soin de 1h30 coûte 80 €, puis 70 € par heure suivante. L'accompagnement est proposé en 4 séances (300 €) ou 7 séances (490 €).","faq.3.q":"Combien coûte un soin énergétique ?","faq.4.a":"Chaque initiation donne lieu à la remise d'un syllabus et d'un certificat. Le Reiki Usui se transmet en 4 degrés : le 1er degré se déroule sur 2 journées (195 €), les 2e, 3e et 4e degrés sur une journée.","faq.4.q":"Que reçoit-on lors d'une initiation au Reiki ?","faq.5.a":"Non. Les soins énergétiques sont complémentaires et ne remplacent pas un avis, un diagnostic ou un traitement médical. Continuez à suivre les conseils de votre médecin.","faq.5.q":"Les soins énergétiques remplacent-ils un traitement médical ?","faq.6.a":"Chaque mois, une méditation guidée angélique à thème d'une heure quart (21 €), avec olfactif et oracle. La méditation se déroule dans le dôme au centre \"Ô coeur du Phoenix\" à Ramegnies-Chin. Un thème différent chaque mois en symbiose avec les énergies du moment. La séance est clôturée par un soin vibratoire au Langage de lumière qui vient travailler plus profondément vos intentions du jour. Chaque séance vous permet d'avancer sur votre chemin d'évolution spirituelle ou de guérison, vers plus de paix, de sérenité.","faq.6.q":"Comment fonctionnent les méditations & soins vibratoires  mensuelles ?","biz.city":"Bailleul (Estaimpuis)","biz.name":"Etre dans la lumière","home.zone":"Le cabinet se trouve Place Abbé César Renard, 31 à 7730 Bailleul (Estaimpuis), tout près de la frontière française. Il accueille les personnes du Hainaut (Estaimpuis, Mouscron, Tournai) et du nord de la France (Roubaix, Tourcoing, Lille). Les soins et la numérologie se font aussi à distance.","about.body":"Je m'appelle Anne Kételair, née à la campagne et depuis toujours connectée au Vivant et à l'invisible, j'observe beaucoup et le comportement humain m'intriguait. Lire, peindre, dessiner,  m'ont permis de restée connectée à cette part de moi qui me soutenait et qui aujourd'hui me paraît essentielle.\nJe me suis toujours tournée vers les médecines alternatives pour mes propres besoins quand l'allopathie ne suffisait plus. \n\nJ'ai vécu des expériences difficiles qui pour retrouver la paix et la santé m'ont amenées à explorer, apprendre, comprendre le pourquoi et le comment de mes expériences, de mon mal-être et de mes souffrances en passant bien entendu par les mains de différents thérapeutes, psychologue, médecins homéopathe, acupuncteur, magnétiseur, ostéopathe, naturopathe, énergéticienne.\n\nJ'ai alors accumulé nombre de lectures et en janvier 2017, j'entamais mon parcours de formations principalement en énergétique mais aussi en psychogénéalogie, kinésiologie, numérologie de la Métamorphose, la systémique...puis les retraites spirituelles et l'hypno-coaching mental aujourd'hui.\n\nLa spiritualité et la foi m'ont aidée sur ce parcours et sont au centre de ma vie, ils forment mon pilier auquel toute mon existence ici-bas est reliée. C'est cette reliance qui m'apporte la force pour avancer. C'est cette connexion avec le Divin et tout le Vivant ; le végétal, les animaux, l'humanité qui réside au plus profond de chacun de nous, la magnifique Terre sur laquelle nous vivons. Alors qu'on est en train de tout détruire sans même en avoir conscience, il me tient à coeur comme tant d'autres d'aider cette planète, par mon élévation et par chaque graine que je pourrai semer en vous accompagnant vers la guérison.\n\nIl était évident pour moi d'aider et de transmettre mes connaissances, chaque jour plus étoffé de mes expériences de vie et des enseignements reçus. En janvier 2019 est donc né \"Être dans la lumière\" à Bailleul dans la commune d'Estaimpuis.\nJe vous accompagne donc en tant que thérapeute énergéticienne, coach bien-être et enseignante.\n\nJe reçois à Bailleul (Estaimpuis) pour les consultations, je propose également des séances en visio ou à distance, notamment pour les animaux. Je peux également travailler sur vos maisons ou autre espaces ainsi que sur des situations précises.\n\nLors des séances, mon accompagnement repose sur l'écoute, la douceur et l'empathie. J'utilise le soin énergétique vibratoire ( langage de lumière ) qui permet une transformation profonde, le décodage biologique, le coaching, les huiles essentielles olfactives, la numérologie de la Métamorphose, les mantras, certains rituels de libérations et les cartes oracle pour un message supplémentaire.\n\nJ'enseigne le Reiki Usui jusqu'au degré de Maître-enseignant, le Lahochi, la 13e Octave, le Triangle Doré d'Isis, le Langage de lumière, la radiesthésie et le Shamballa, et j'anime des méditations guidées et des chants sacrés.","biz.slogan":"Ouvrir une porte vers la libération","biz.titles":"Thérapeute énergéticienne, Coach bien-être & Enseignante","blog.intro":"Des articles sur les soins énergétiques, le langage de lumière, la numérologie, le Reiki et la méditation.","blog.title":"Blog","book.intro":"Choisissez votre soin, puis réservez un créneau libre ou demandez à être rappelée. Le paiement se fait sur place ou par virement.","book.title":"Prendre rendez-vous","about.title":"Qui suis-je ? Qu'est-ce qui m'anime ?","biz.address":"Place Abbé César Renard, 31","biz.country":"Belgique","biz.domains":"Spiritualité, thérapies et soins énergétiques vibratoires, Langage de lumière, développement personnel, méditation guidée angélique et chants sacrés, coaching. Formations Thérapeute énergéticien, Reiki, Lahochi, 13e Octave, Triangle Doré d'Isis, Langage de lumière, radiesthésie.","soins.intro":"Consultations avec soin énergétique, accompagnement sur plusieurs séances, coaching et numérologie de la Métamorphose, au cabinet de Bailleul, à distance ou en visio.","soins.title":"Soins & accompagnement","agenda.intro":"Toutes les prochaines dates des formations, ateliers et méditations. Inscrivez-vous en ligne : les places sont limitées.","agenda.title":"Agenda","booking.mode":"slots","ebooks.intro":"Des guides à lire chez soi, disponibles immédiatement après l'achat.","ebooks.title":"E-books","cancel.policy":"Merci de prévenir au moins 48 heures à l'avance en cas d'empêchement. Pour les formations, une date de report vous est proposée en priorité.","contact.intro":"Pour une question ou un rendez-vous, appelez Anne, écrivez-lui ou utilisez le formulaire ci-dessous.","contact.title":"Contact","home.benefits":["Se ressourcer","Sérénité","Gérer son stress","Se recentrer","Vie relationnelle","Clarté d'esprit","Apaisement et détente","Soulager ses douleurs","Développement personnel","Cheminer dans sa spiritualité"],"home.cta.body":"Réservez un créneau en ligne, demandez à être rappelée ou appelez directement Anne. Le paiement des soins se fait sur place ou par virement.","home.distance":"Soins possibles à distance et en visio, pour les humains, les animaux, les plantes, les maisons et les situations.","ateliers.intro":"Pendule et radiesthésie, sur 3 niveaux, numérologie de la Métamorphose, et séances de méditations guidées chaque mois.","ateliers.title":"Ateliers & méditations","health.warning":"Les soins énergétiques sont complémentaires et ne remplacent pas un avis, un diagnostic ou un traitement médical.","home.cta.title":"Prête à vous offrir un temps pour vous ?","home.hero.title":"Thérapies énergétiques, Formations & Méditations","home.intro.body":"Dans un cadre accueillant, la consultation commence toujours par un temps d'écoute, avec empathie et sans jugement. Ensemble, nous mettons des mots sur les maux grâce au décodage biologique. Nous prenons ensuite un moment pour respirer une huile essentielle olfactive qui prépare le soin et apporte son éclairage. Nous poursuivons ensuite avec le soin énergétique vibratoire en \nLangage de lumière, celui-ci agit au niveau cellulaire, aide à relâcher les tensions, à retrouver votre équilibre, permet la déprogrammation de certains shémas et l'activation de votre Adn encore endormi. Il agit sur tous les plans vibratoires, il est multidimensionnel.\nNous terminons par le tirage d'une carte oracle.\n\nSelon vos besoins, la séance peut également intégrer du coaching et/ou des techniques hypnotiques. Et pour poursuivre les bienfaits et progresser sur l'intention du jour, repartez avec des mantras, des exercices ou un échantillon d'HE olfactive. Chaque accompagnement est personnalisé et respecte votre rythme.\n\n\nAnne transmet aussi ce qu'elle pratique : initiations au Reiki Usui en 4 degrés, au Lahochi, Lahochi de la 13e Octave, au Triangle Doré d'Isis et Langage de lumière, ateliers de radiesthésie sur 3 niveaux, mantra de l'âme en numérologie et méditations guidées chaque mois dans le dôme du Centre Ô Coeur du Phoenix à Ramegnies-Chin (Tournai), divers ateliers ponctuels comme  les chants sacrés ou cérémonie.","biz.practitioner":"Anne Kételair / Auria","formations.intro":"Formation Thérapeute Energéticien(ne) - Initiations au Reiki Usui (4 degrés), au Lahochi / 13e Octave, Triangle Doré d'Isis, Langage de lumière et Shamballa, en petit groupe à Bailleul (Estaimpuis).New","formations.title":"Formations & initiations","home.intro.title":"Un temps pour vous déposer, aller à la rencontre de vous-même et pour accueillir les libérations","home.announce.text":"Méditation guidée Angélique & Soin vibratoire chaque mois : découvrez les prochaines dates dans l'agenda.","home.hero.subtitle":"Anne Kételair vous accompagne au cabinet, à distance ou en visio pour vous reconnecter à votre lumière intérieure et retrouver ainsi plus de paix et de clarté d'esprit.","testimonials.intro":"Les retours des personnes accompagnées par Anne, publiés avec leur accord.","testimonials.title":"Témoignages","home.benefits.title":"Ce que les soins peuvent vous apporter","training.certificate":"Un syllabus et un certificat sont remis à chaque initiation, formation ou atelier radiesthésie"},"biz.domains.en":"Spirituality, vibrational energy therapies and healing, Language of Light, personal development, angelic guided meditation and sacred chanting, coaching. Training programs: Energy Therapist, Reiki, Lahochi, 13th Octave, Golden Triangle of Isis, Language of Light, radiesthesia.","home.zone":"Le cabinet se trouve Place Abbé César Renard, 31 à 7730 Bailleul (Estaimpuis), tout près de la frontière française. Il accueille les personnes du Hainaut (Estaimpuis, Mouscron, Tournai) et du nord de la France (Roubaix, Tourcoing, Lille). Les soins et la numérologie se font aussi à distance.","home.cta.title":"Prête à vous offrir un temps pour vous ?","home.cta.body":"Réservez un créneau en ligne, demandez à être rappelée ou appelez directement Anne. Le paiement des soins se fait sur place ou par virement.","biz.domains.nl":"Spiritualiteit, energetische therapieën en vibratiegerichte zorg, Langage de lumière, persoonlijke groei, begeleide meditatie met engelen en heilige gezangen, coaching. Opleidingen Energetisch therapeut, Reiki, Lahochi, 13e Octave, Triangle Doré d'Isis, Langage de lumière, radiësthesie.","training.certificate.en":"A syllabus and a certificate are given with every initiation, training course or radiesthesia workshop","training.certificate.nl":"Bij elke initiatie, opleiding of workshop radiësthesie ontvangt u een syllabus en een certificaat","faq.3.a":"Un soin seul d'une heure coûte 70 € (250 € les 4 séances). La consultation avec soin de 1h30 coûte 80 €, puis 70 € par heure suivante. L'accompagnement est proposé en 4 séances (300 €) ou 7 séances (490 €).","faq.4.q":"Que reçoit-on lors d'une initiation au Reiki ?","home.intro.body":"Dans un cadre accueillant, la consultation commence toujours par un temps d'écoute, avec empathie et sans jugement. Ensemble, nous mettons des mots sur les maux grâce au décodage biologique. Nous prenons ensuite un moment pour respirer une huile essentielle olfactive qui prépare le soin et apporte son éclairage. Nous poursuivons ensuite avec le soin énergétique vibratoire en \nLangage de lumière, celui-ci agit au niveau cellulaire, aide à relâcher les tensions, à retrouver votre équilibre, permet la déprogrammation de certains shémas et l'activation de votre Adn encore endormi. Il agit sur tous les plans vibratoires, il est multidimensionnel.\nNous terminons par le tirage d'une carte oracle.\n\nSelon vos besoins, la séance peut également intégrer du coaching et/ou des techniques hypnotiques. Et pour poursuivre les bienfaits et progresser sur l'intention du jour, repartez avec des mantras, des exercices ou un échantillon d'HE olfactive. Chaque accompagnement est personnalisé et respecte votre rythme.\n\n\nAnne transmet aussi ce qu'elle pratique : initiations au Reiki Usui en 4 degrés, au Lahochi, Lahochi de la 13e Octave, au Triangle Doré d'Isis et Langage de lumière, ateliers de radiesthésie sur 3 niveaux, mantra de l'âme en numérologie et méditations guidées chaque mois dans le dôme du Centre Ô Coeur du Phoenix à Ramegnies-Chin (Tournai), divers ateliers ponctuels comme  les chants sacrés ou cérémonie.","faq.4.a":"Chaque initiation donne lieu à la remise d'un syllabus et d'un certificat. Le Reiki Usui se transmet en 4 degrés : le 1er degré se déroule sur 2 journées (195 €), les 2e, 3e et 4e degrés sur une journée.","home.intro.body.nl":"In een uitnodigende omgeving begint de consultatie altijd met een moment van luisteren, met empathie en zonder oordeel. Samen geven we woorden aan de klachten dankzij biologische decodering. Daarna nemen we even de tijd om een olfactorische essentiële olie in te ademen, die het traject voorbereidt en er haar licht op werpt. Vervolgens gaan we verder met de vibratorische energetische behandeling in \nLangage de lumière. Deze werkt op cellulair niveau, helpt spanningen los te laten, uw evenwicht terug te vinden, maakt het mogelijk bepaalde patronen te deprogrammeren en uw nog slapende DNA te activeren. Ze werkt op alle vibratorische niveaus, ze is multidimensionaal.\nWe eindigen met het trekken van een orakelkaart.\n\nAfhankelijk van uw behoeften kan de sessie ook coaching en/of hypnotische technieken bevatten. En om de voordelen voort te zetten en vooruitgang te boeken op de intentie van de dag, gaat u naar huis met mantra's, oefeningen of een staaltje olfactorische essentiële olie. Elke begeleiding is persoonlijk en respecteert uw tempo.\n\n\nAnne geeft ook door wat zij beoefent: initiaties in Reiki Usui in 4 graden, in Lahochi, Lahochi van de 13e Octaaf, in de Gouden Driehoek van Isis en Langage de lumière, workshops radiësthesie op 3 niveaus, zielsmantra in numerologie en maandelijkse geleide meditaties in de koepel van het Centre Ô Coeur du Phoenix in Ramegnies-Chin (Tournai), diverse eenmalige workshops zoals gewijde gezangen of ceremonie.","home.intro.body.en":"In a welcoming setting, each consultation always begins with a time of listening, with empathy and without judgment. Together, we put words to ailments through biological decoding. We then take a moment to breathe in an aromatic essential oil that prepares the session and brings its own insight. We then continue with the vibrational energy healing in \nLanguage of Light. It acts at the cellular level, helps release tension, restores your balance, allows certain patterns to be deprogrammed and your dormant DNA to be activated. It works on all vibrational planes; it is multidimensional.\nWe conclude with the drawing of an oracle card.\n\nDepending on your needs, the session may also include coaching and/or hypnotic techniques. And to continue reaping the benefits and make progress on the intention of the day, you leave with mantras, exercises, or a sample of aromatic essential oil. Every session is personalized and respects your own pace.\n\n\nAnne also shares what she practices: initiations in Reiki Usui in 4 degrees, in Lahochi, Lahochi of the 13th Octave, in the Golden Triangle of Isis and Language of Light; radiesthesia workshops on 3 levels; soul mantra in numerology; and guided meditations every month in the dome of the Centre Ô Coeur du Phoenix in Ramegnies-Chin (Tournai), as well as various one-off workshops such as sacred chanting or ceremonies.","faq.5.a":"Non. Les soins énergétiques sont complémentaires et ne remplacent pas un avis, un diagnostic ou un traitement médical. Continuez à suivre les conseils de votre médecin.","biz.bce":"BE 712.839.3430","faq.6.q":"Comment fonctionnent les méditations & soins vibratoires  mensuelles ?","biz.bce.en":"BE 712.839.3430","biz.bce.nl":"BE 712.839.3430","biz.practitioner.en":"Anne Kételair / Auria","biz.practitioner.nl":"Anne Kételair / Auria","faq.6.a":"Chaque mois, une méditation guidée angélique à thème d'une heure quart (21 €), avec olfactif et oracle. La méditation se déroule dans le dôme au centre \"Ô coeur du Phoenix\" à Ramegnies-Chin. Un thème différent chaque mois en symbiose avec les énergies du moment. La séance est clôturée par un soin vibratoire au Langage de lumière qui vient travailler plus profondément vos intentions du jour. Chaque séance vous permet d'avancer sur votre chemin d'évolution spirituelle ou de guérison, vers plus de paix, de sérenité.","soins.title":"Soins & accompagnement","book.intro":"Choisissez votre soin, puis réservez un créneau libre ou demandez à être rappelée. Le paiement se fait sur place ou par virement.","about.image":"https://zigsggfhmafapjvjxlpt.supabase.co/storage/v1/object/public/public-assets/images/1794485611865-zw4p1n.webp","soins.intro":"Consultations avec soin énergétique, accompagnement sur plusieurs séances, coaching et numérologie de la Métamorphose, au cabinet de Bailleul, à distance ou en visio.","faq.1.a.en":"The consultation lasts 1h30 and costs €80. It begins with a time of listening, followed by the energy healing session. The session can be complemented by biological decoding, mantras, essential oils or the drawing of a card.","faq.1.a.nl":"De consultatie duurt 1u30 en kost 80 €. Ze begint met een moment van luisteren, daarna volgt de energetische behandeling. De sessie kan aangevuld worden met biologische decodering, mantra's, etherische oliën of het trekken van een kaart.","faq.1.q.en":"What does an energy healing consultation involve?","faq.1.q.nl":"Hoe verloopt een consultatie met energetische behandeling?","faq.2.a.en":"Yes. Treatments can be done remotely or by video call, for yourself but also for an animal, a plant, a home or a situation. The appointment is scheduled just like a session at the practice.","faq.2.a.nl":"Ja. De behandelingen kunnen op afstand of via video plaatsvinden, voor uzelf maar ook voor een dier, een plant, een huis of een situatie. De afspraak wordt gemaakt zoals voor een sessie in de praktijk.","faq.2.q.en":"Is a remote healing session possible?","faq.2.q.nl":"Is een behandeling op afstand mogelijk?","faq.3.a.en":"A single one-hour session costs €70 (€250 for 4 sessions). The 1h30 consultation with a healing session costs €80, then €70 for each additional hour. Ongoing support is offered as 4 sessions (€300) or 7 sessions (€490).","faq.3.a.nl":"Een behandeling van een uur kost 70 € (250 € voor 4 sessies). De consultatie met behandeling van 1u30 kost 80 €, daarna 70 € per extra uur. De begeleiding wordt aangeboden in 4 sessies (300 €) of 7 sessies (490 €).","faq.3.q.en":"How much does an energy healing session cost?","faq.3.q.nl":"Hoeveel kost een energetische behandeling?","faq.4.a.en":"Every initiation comes with a syllabus and a certificate. Reiki Usui is taught in 4 degrees: the 1st degree takes place over 2 days (€195), and the 2nd, 3rd and 4th degrees over one day each.","faq.4.a.nl":"Bij elke initiatie ontvangt u een syllabus en een certificaat. Reiki Usui wordt doorgegeven in 4 graden: de 1e graad verloopt over 2 dagen (195 €), de 2e, 3e en 4e graad over één dag.","faq.4.q.en":"What do you receive during a Reiki initiation?","faq.4.q.nl":"Wat ontvangt u bij een Reiki-initiatie?","faq.5.a.en":"No. Energy healing is complementary and does not replace medical advice, a diagnosis or treatment. Please continue to follow your doctor's advice.","faq.5.a.nl":"Nee. Energetische behandelingen zijn een aanvulling en vervangen geen medisch advies, geen diagnose en geen medische behandeling. Blijf de raad van uw arts opvolgen.","faq.5.q.en":"Do energy healing sessions replace medical treatment?","faq.5.q.nl":"Vervangen energetische behandelingen een medische behandeling?","faq.6.a.en":"Each month, a themed guided angelic meditation lasting an hour and a quarter (€21), with scents and an oracle. The meditation takes place in the dome at the \"Ô coeur du Phoenix\" center in Ramegnies-Chin. The theme changes every month, in harmony with the energies of the moment. The session ends with a vibrational healing in the Language of Light, which works more deeply on your intentions for the day. Each session helps you move forward on your path of spiritual growth or healing, towards more peace and serenity.","home.hero.image.size":"full","theme.brand":"#7c3aed","about.title":"Qui suis-je ? Qu'est-ce qui m'anime ?","about.body":"Je m'appelle Anne Kételair, née à la campagne et depuis toujours connectée au Vivant et à l'invisible, j'observe beaucoup et le comportement humain m'intriguait. Lire, peindre, dessiner,  m'ont permis de restée connectée à cette part de moi qui me soutenait et qui aujourd'hui me paraît essentielle.\nJe me suis toujours tournée vers les médecines alternatives pour mes propres besoins quand l'allopathie ne suffisait plus. \n\nJ'ai vécu des expériences difficiles qui pour retrouver la paix et la santé m'ont amenées à explorer, apprendre, comprendre le pourquoi et le comment de mes expériences, de mon mal-être et de mes souffrances en passant bien entendu par les mains de différents thérapeutes, psychologue, médecins homéopathe, acupuncteur, magnétiseur, ostéopathe, naturopathe, énergéticienne.\n\nJ'ai alors accumulé nombre de lectures et en janvier 2017, j'entamais mon parcours de formations principalement en énergétique mais aussi en psychogénéalogie, kinésiologie, numérologie de la Métamorphose, la systémique...puis les retraites spirituelles et l'hypno-coaching mental aujourd'hui.\n\nLa spiritualité et la foi m'ont aidée sur ce parcours et sont au centre de ma vie, ils forment mon pilier auquel toute mon existence ici-bas est reliée. C'est cette reliance qui m'apporte la force pour avancer. C'est cette connexion avec le Divin et tout le Vivant ; le végétal, les animaux, l'humanité qui réside au plus profond de chacun de nous, la magnifique Terre sur laquelle nous vivons. Alors qu'on est en train de tout détruire sans même en avoir conscience, il me tient à coeur comme tant d'autres d'aider cette planète, par mon élévation et par chaque graine que je pourrai semer en vous accompagnant vers la guérison.\n\nIl était évident pour moi d'aider et de transmettre mes connaissances, chaque jour plus étoffé de mes expériences de vie et des enseignements reçus. En janvier 2019 est donc né \"Être dans la lumière\" à Bailleul dans la commune d'Estaimpuis.\nJe vous accompagne donc en tant que thérapeute énergéticienne, coach bien-être et enseignante.\n\nJe reçois à Bailleul (Estaimpuis) pour les consultations, je propose également des séances en visio ou à distance, notamment pour les animaux. Je peux également travailler sur vos maisons ou autre espaces ainsi que sur des situations précises.\n\nLors des séances, mon accompagnement repose sur l'écoute, la douceur et l'empathie. J'utilise le soin énergétique vibratoire ( langage de lumière ) qui permet une transformation profonde, le décodage biologique, le coaching, les huiles essentielles olfactives, la numérologie de la Métamorphose, les mantras, certains rituels de libérations et les cartes oracle pour un message supplémentaire.\n\nJ'enseigne le Reiki Usui jusqu'au degré de Maître-enseignant, le Lahochi, la 13e Octave, le Triangle Doré d'Isis, le Langage de lumière, la radiesthésie et le Shamballa, et j'anime des méditations guidées et des chants sacrés.","faq.6.a.nl":"Elke maand is er een begeleide engelenmeditatie rond een thema van een uur en een kwartier (21 €), met geuren en orakel. De meditatie vindt plaats in de koepel in het centrum \"Ô coeur du Phoenix\" in Ramegnies-Chin. Elke maand een ander thema, in harmonie met de energieën van het moment. De sessie wordt afgesloten met een vibratiebehandeling met Lichttaal, die uw intenties van de dag nog dieper doorwerkt. Elke sessie helpt u vooruit op uw pad van spirituele groei of heling, naar meer vrede en sereniteit.","faq.6.q.en":"How do the monthly meditations & vibrational healing sessions work?","faq.6.q.nl":"Hoe werken de maandelijkse meditaties & vibratiebehandelingen?","blog.intro.en":"Articles about energy healing, the Language of Light, numerology, Reiki and meditation.","blog.intro.nl":"Artikelen over energetische behandelingen, lichttaal, numerologie, Reiki en meditatie.","blog.title.en":"Blog","blog.title.nl":"Blog","book.intro.en":"Choose your treatment, then book an available slot or ask to be called back. Payment is made on site or by bank transfer.","book.intro.nl":"Kies uw behandeling en reserveer vervolgens een vrij tijdslot of vraag om teruggebeld te worden. De betaling gebeurt ter plaatse of via overschrijving.","book.title.en":"Book an appointment","book.title.nl":"Een afspraak maken","soins.intro.en":"Consultations with energy healing, support over several sessions, coaching and Metamorphosis numerology, at the Bailleul practice, remotely or by video call.","soins.intro.nl":"Consultaties met energetische behandeling, begeleiding over meerdere sessies, coaching en numerologie van de Metamorfose, in de praktijk in Bailleul, op afstand of via video.","soins.title.en":"Healing & support","soins.title.nl":"Behandelingen & begeleiding","agenda.intro.en":"All upcoming dates for trainings, workshops and meditations. Sign up online: places are limited.","agenda.intro.nl":"Alle komende data van de opleidingen, workshops en meditaties. Schrijf u online in: het aantal plaatsen is beperkt.","agenda.title.en":"Calendar","agenda.title.nl":"Agenda","ebooks.intro.en":"Guides to read at home, available immediately after purchase.","ebooks.intro.nl":"Gidsen om thuis te lezen, direct beschikbaar na aankoop.","ebooks.title.en":"E-books","ebooks.title.nl":"E-books","contact.intro.en":"For a question or an appointment, call Anne, write to her or use the form below.","contact.intro.nl":"Voor een vraag of een afspraak kunt u Anne bellen, haar een bericht sturen of het onderstaande formulier gebruiken.","contact.title.en":"Contact","contact.title.nl":"Contact","ateliers.intro.en":"Pendulum and radiesthesia in 3 levels, Metamorphosis numerology, and guided meditation sessions every month.","ateliers.intro.nl":"Pendel en radiësthesie op 3 niveaus, numerologie van de Metamorfose, en elke maand begeleide meditaties.","ateliers.title.en":"Workshops & meditations","ateliers.title.nl":"Workshops & meditaties","testimonials.intro.en":"Feedback from the people Anne has supported, published with their consent.","testimonials.intro.nl":"De ervaringen van de mensen die door Anne begeleid werden, gepubliceerd met hun toestemming.","testimonials.title.en":"Testimonials","testimonials.title.nl":"Getuigenissen","about.body.en":"My name is Anne Kételair. Born in the countryside and connected since always to the Living and the invisible, I observe a great deal, and human behavior has always intrigued me. Reading, painting, and drawing allowed me to stay connected to that part of myself that supported me and that today feels essential.\nI have always turned to alternative medicine for my own needs whenever conventional medicine was no longer enough.\n\nI went through difficult experiences which, in my search for peace and health, led me to explore, learn, and understand the why and the how of my experiences, my unease, and my suffering. Of course, this meant seeing a variety of therapists: a psychologist, a homeopathic doctor, an acupuncturist, a magnetizer, an osteopath, a naturopath, and an energy healer.\n\nI accumulated a great many readings, and in January 2017 I began my training, mainly in energy work but also in psychogenealogy, kinesiology, Metamorphosis numerology, systemic approaches... followed by spiritual retreats and, today, mental hypno-coaching.\n\nSpirituality and faith have helped me on this journey and are at the heart of my life. They form the pillar to which my entire existence here below is connected. It is this connection that gives me the strength to move forward: the bond with the Divine and with all of Life, the plants, the animals, the humanity that lives in the deepest part of each of us, and the magnificent Earth we live on. As we are destroying so much without even being aware of it, I care deeply, like so many others, about helping this planet, through my own elevation and through every seed I can plant while guiding you toward healing.\n\nIt was obvious to me to help and to share my knowledge, which grows richer each day with my life experiences and the teachings I have received. In January 2019, \"Être dans la lumière\" was born in Bailleul, in the municipality of Estaimpuis.\nI support you as an energy therapist, wellness coach, and teacher.\n\nI receive clients in Bailleul (Estaimpuis) for consultations. I also offer sessions by video or at a distance, especially for animals. I can also work on your homes or other spaces, as well as on specific situations.\n\nDuring sessions, my approach is built on listening, gentleness, and empathy. I use vibrational energy healing (the language of light), which allows for profound transformation, biological decoding, coaching, olfactory essential oils, Metamorphosis numerology, mantras, certain liberation rituals, and oracle cards for an additional message.\n\nI teach Usui Reiki up to the Master-Teacher level, Lahochi, the 13th Octave, the Golden Triangle of Isis, the Language of Light, radiesthesia, and Shamballa. I also lead guided meditations and sacred chanting.","about.body.nl":"Ik heet Anne Kételair, ik ben geboren op het platteland en ik ben altijd al verbonden geweest met het Levende en het onzichtbare. Ik observeer veel en menselijk gedrag intrigeerde me. Lezen, schilderen en tekenen hebben me geholpen verbonden te blijven met dat deel van mezelf dat me steunde en dat me vandaag essentieel lijkt.\nIk heb me altijd tot alternatieve geneeswijzen gewend voor mijn eigen noden wanneer de allopathie niet langer volstond.\n\nIk heb moeilijke ervaringen meegemaakt die me, om rust en gezondheid terug te vinden, ertoe brachten te verkennen, te leren en het waarom en hoe van mijn ervaringen, mijn onwelzijn en mijn lijden te begrijpen. Dat gebeurde uiteraard via de handen van verschillende therapeuten: een psycholoog, een homeopathische arts, een acupuncturist, een magnetiseur, een osteopaat, een natuurarts en een energetica-therapeute.\n\nIk las toen heel wat, en in januari 2017 begon ik aan mijn opleidingstraject, voornamelijk in energetica, maar ook in psychogenealogie, kinesiologie, Metamorfose-numerologie, systemiek... gevolgd door spirituele retraites en tegenwoordig hypno-coaching van de geest.\n\nSpiritualiteit en geloof hebben me op dit pad geholpen en staan centraal in mijn leven. Ze vormen mijn pijler, waaraan heel mijn bestaan hier op aarde verbonden is. Die verbondenheid geeft me de kracht om verder te gaan. Het is deze verbinding met het Goddelijke en met al het Levende: de planten, de dieren, de mensheid die diep in ieder van ons huist, en de prachtige Aarde waarop we leven. Terwijl we alles aan het vernietigen zijn zonder er zelfs maar bewust van te zijn, ligt het me, net als zovele anderen, nauw aan het hart deze planeet te helpen, door mijn eigen verheffing en door elk zaadje dat ik kan zaaien terwijl ik jullie begeleid naar genezing.\n\nHet was voor mij vanzelfsprekend om te helpen en mijn kennis door te geven, die elke dag rijker werd door mijn levenservaringen en de lessen die ik ontving. In januari 2019 werd zo \"Être dans la lumière\" geboren in Bailleul, in de gemeente Estaimpuis.\nIk begeleid jullie dus als energetica-therapeute, welzijnscoach en lerares.\n\nIk ontvang in Bailleul (Estaimpuis) voor consultaties. Daarnaast bied ik ook sessies via video of op afstand aan, met name voor dieren. Ik kan ook werken aan jullie huizen of andere ruimtes, evenals aan specifieke situaties.\n\nTijdens de sessies steunt mijn begeleiding op luisteren, zachtheid en empathie. Ik gebruik vibrationele energetische zorg (lichttaal), die een diepgaande transformatie mogelijk maakt, biologische decodering, coaching, geurige essentiële oliën, Metamorfose-numerologie, mantra's, bepaalde bevrijdingsrituelen en orakelkaarten voor een extra boodschap.\n\nIk geef les in Reiki Usui tot en met de graad van Meester-leraar, Lahochi, de 13e Octaaf, de Gouden Driehoek van Isis, Lichttaal, radiësthesie en Shamballa, en ik leid geleide meditaties en heilige zang.","about.title.en":"Who am I? What drives me?","about.title.nl":"Wie ben ik? Wat drijft me?","deposit.migrated":"true","formations.title.en":"Workshops & introductory sessions","formations.title.nl":"Opleidingen & inwijdingen","formations.intro.en":"Energy Therapist Training - Initiations into Usui Reiki (4 degrees), Lahochi / 13th Octave, Golden Triangle of Isis, Light Language and Shamballa, in small groups in Bailleul (Estaimpuis).New","formations.intro.nl":"Opleiding tot Energetisch Therapeut(e) - Inwijdingen in Reiki Usui (4 graden), Lahochi / 13e Octaaf, Gouden Driehoek van Isis, Taal van het Licht en Shamballa, in kleine groep te Bailleul (Estaimpuis).New","deposit.percent":"30","home.hero.image.frame":"organic"};</script>
